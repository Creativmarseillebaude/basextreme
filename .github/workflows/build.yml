name: Compiler B.A.S.E.

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Ajouter MSBuild au PATH
        uses: microsoft/setup-msbuild@v2

      - name: Localiser Visual Studio
        id: vs
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $path = & $vswhere -latest -property installationPath
          echo "devenv=$path\Common7\IDE\devenv.com" >> $env:GITHUB_OUTPUT

      - name: Convertir les projets au format actuel
        continue-on-error: true
        shell: cmd
        working-directory: src
        run: |
          "${{ steps.vs.outputs.devenv }}" game.sln /Upgrade

      - name: Compiler en Release
        continue-on-error: true
        shell: cmd
        working-directory: src
        run: msbuild game.sln /p:Configuration=Release /p:Platform=Win32 /m /v:normal > release.log 2>&1

      - name: Compiler en Debug
        continue-on-error: true
        shell: cmd
        working-directory: src
        run: msbuild game.sln /p:Configuration=Debug /p:Platform=Win32 /m /v:normal > debug.log 2>&1

      # Ecrit les erreurs directement sur la page de resume du job,
      # ou elles sont lisibles sans deplier le moindre journal.
      - name: Resume des erreurs
        if: always()
        shell: pwsh
        run: |
          foreach ($f in @("src/release.log","src/debug.log")) {
            "## $f" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
            if (Test-Path $f) {
              $e = Select-String -Path $f -Pattern "error [A-Z]+[0-9]+" |
                   ForEach-Object { $_.Line.Trim() } | Select-Object -Unique -First 40
              if ($e) {
                "```" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
                $e | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
                "```" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
              } else { "Aucune erreur." | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY }
            } else { "Journal absent." | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY }
          }
          "## Binaires produits" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          "```" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          Get-ChildItem -Path . -Recurse -Include *.dll,*.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch "Includes" } |
            ForEach-Object { $_.FullName.Replace($PWD.Path + "\","") } |
            Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          "```" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      - name: Recuperer les binaires et les journaux
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binaires-BASE
          path: |
            game/**/*.dll
            game/**/*.exe
            src/*.log
          if-no-files-found: warn
