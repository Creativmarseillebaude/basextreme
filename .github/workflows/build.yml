name: Compiler B.A.S.E. (revision mai 2010)

# Revision 6b3b6f74 du 2 mai 2010 : la derniere avant le commit du 5 mai qui a
# introduit le chargement automatique des voiles depuis res/Gear. Elle est donc
# compatible avec les donnees des editions Web et Pro, tout en beneficiant de
# tous les correctifs intermediaires. Les correctifs de portage sont appliques
# a la volee ci-dessous.

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Recuperer la revision du 2 mai 2010
        uses: actions/checkout@v4
        with:
          repository: cheinkn/basextreme
          ref: 6b3b6f7403885876229fdcb4b3eb8690148ac590

      - name: Ajouter MSBuild au PATH
        uses: microsoft/setup-msbuild@v2

      - name: Localiser Visual Studio
        id: vs
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $path = & $vswhere -latest -property installationPath
          echo "devenv=$path\Common7\IDE\devenv.com" >> $env:GITHUB_OUTPUT

      - name: Appliquer les correctifs
        shell: pwsh
        run: |
          $nl = [char]10
          $d  = [char]36
          $q  = [char]34
          $ok = $true

          # 1 - en-tete rpcsal.h perime du SDK DirectX 2007
          $r = "src/Includes/DirectX/Include/rpcsal.h"
          if (Test-Path $r) { Remove-Item $r; Write-Host "1. rpcsal.h supprime" } else { Write-Host "1. rpcsal.h absent" }

          # 2 - reglages MSBuild communs
          $targets = @(
            "<Project>",
            "  <ItemDefinitionGroup>",
            "    <ClCompile>",
            "      <PrecompiledHeader>NotUsing</PrecompiledHeader>",
            ("      <AdditionalIncludeDirectories>" + $d + "(MSBuildProjectDirectory);" + $d + "(MSBuildThisFileDirectory)Includes\TinyXML\include;" + $d + "(MSBuildThisFileDirectory)Includes\Ogg\include;" + $d + "(MSBuildThisFileDirectory)Includes\Vorbis\include;%(AdditionalIncludeDirectories)</AdditionalIncludeDirectories>"),
            "    </ClCompile>",
            "    <Link>",
            "      <ImageHasSafeExceptionHandlers>false</ImageHasSafeExceptionHandlers>",
            ("      <AdditionalLibraryDirectories>" + $d + "(MSBuildThisFileDirectory)Libraries;%(AdditionalLibraryDirectories)</AdditionalLibraryDirectories>"),
            "      <AdditionalDependencies>legacy_stdio_definitions.lib;vorbisfile_static.lib;vorbis_static.lib;ogg_static.lib;%(AdditionalDependencies)</AdditionalDependencies>",
            "    </Link>",
            "  </ItemDefinitionGroup>",
            "</Project>"
          ) -join $nl
          Set-Content -Path "src/Directory.Build.targets" -Value $targets
          Write-Host "2. Directory.Build.targets ecrit"

          # 3 - correctif Uniscribe
          $p = "src/engine/guiedit.cpp"
          $t = (Get-Content $p -Raw).Replace([char]13 + [char]10, $nl)
          $old = @(
            "    assert( length );",
            "    _glyphWidths.resize( (size_t) *length );",
            "    ScriptStringGetLogicalWidths( _strAnalysis, &_glyphWidths[0] );"
          ) -join $nl
          $new = @(
            "    if( length )",
            "    {",
            "        _glyphWidths.resize( (size_t) *length );",
            "        ScriptStringGetLogicalWidths( _strAnalysis, &_glyphWidths[0] );",
            "    }",
            "    else",
            "    {",
            "        // Wine ne gere pas ScriptStringAnalyse en mode ANSI : on",
            "        // mesure alors chaque caractere directement avec GDI.",
            "        _glyphWidths.resize( _text.length() + 1, 0 );",
            "        HDC dc = font->GetDC();",
            "        for( size_t i = 0; i < _text.length(); i++ )",
            "        {",
            "            SIZE cs = { 0, 0 };",
            "            if( GetTextExtentPoint32A( dc, _text.c_str() + i, 1, &cs ) )",
            "            {",
            "                _glyphWidths[i] = cs.cx;",
            "            }",
            "        }",
            "    }"
          ) -join $nl
          if ($t.Contains($old)) {
            Set-Content -Path $p -Value $t.Replace($old, $new) -NoNewline
            Write-Host "3. guiedit.cpp corrige (Uniscribe)"
          } else { Write-Host "3. ERREUR motif Uniscribe introuvable"; $ok = $false }

          # 4 - iterateur _Mynode supprime de la bibliotheque standard
          $p2 = "src/engine/animation.cpp"
          $a = (Get-Content $p2 -Raw).Replace([char]13 + [char]10, $nl)
          $n4 = 0
          if ($a.Contains("_activeWeightSetI._Mynode() != 0")) {
            $a = $a.Replace("_activeWeightSetI._Mynode() != 0", "_activeWeightSetI != _weightSetMap.end()"); $n4++
          }
          if ($a.Contains("_activeWeightSetI = WeightSetI();")) {
            $a = $a.Replace("_activeWeightSetI = WeightSetI();", "_activeWeightSetI = _weightSetMap.end();"); $n4++
          }
          $mc = [regex]::Match($a, "AnimationController::AnimationController\s*\([^)]*\)[^{]*\{")
          if ($mc.Success) {
            $a = $a.Insert($mc.Index + $mc.Length, $nl + "    _activeWeightSetI = _weightSetMap.end();"); $n4++
          }
          Set-Content -Path $p2 -Value $a -NoNewline
          Write-Host ("4. animation.cpp : " + $n4 + " correction(s)")
          if ($n4 -lt 3) { Write-Host "4. ATTENTION toutes les corrections n ont pas ete appliquees" }

          # 5 - chemins absolus du disque du developpeur d origine
          $p3 = "src/engine/engine.vcproj"
          $enc = [System.Text.Encoding]::GetEncoding(28591)
          $v = [System.IO.File]::ReadAllText($p3, $enc)
          $base = "E:\Projects\Base eXtreme\Work\src\engine\"
          $n5 = 0
          foreach ($nm in @("configreader.cpp", "configreader.h")) {
            if ($v.Contains($base + $nm)) { $v = $v.Replace($base + $nm, ".\" + $nm); $n5++ }
          }
          [System.IO.File]::WriteAllText($p3, $v, $enc)
          Write-Host ("5. engine.vcproj : " + $n5 + " chemin(s) absolu(s) corrige(s)")

          # 7 - reverberation DirectSound non implementee par Wine
          $p4 = "src/audio2/spatial.cpp"
          $sp = (Get-Content $p4 -Raw).Replace([char]13 + [char]10, $nl)
          $oldR = "_dsCR( iDirectSoundFXWavesReverb8->SetAllParameters( &parameters ) );"
          $newR = "iDirectSoundFXWavesReverb8->SetAllParameters( &parameters ); // Wine ne l implemente pas : echec tolere"
          if ($sp.Contains($oldR)) {
            Set-Content -Path $p4 -Value $sp.Replace($oldR, $newR) -NoNewline
            Write-Host "7. spatial.cpp : reverberation rendue non fatale"
          } else { Write-Host "7. ATTENTION motif reverberation introuvable" }

          # 6 - construire language en Release
          $s = "src/game.sln"
          $lines = [System.Collections.ArrayList](Get-Content $s)
          $needle = "= " + $q + "language" + $q + ","
          $guid = $null
          foreach ($l in $lines) {
            if ($l.Contains($needle)) {
              $mm = [regex]::Matches($l, "\{([0-9A-Fa-f-]+)\}")
              if ($mm.Count -gt 0) { $guid = $mm[$mm.Count - 1].Groups[1].Value }
            }
          }
          if ($guid) {
            $n6 = 0
            for ($i = $lines.Count - 1; $i -ge 0; $i--) {
              if ($lines[$i].Contains($guid) -and $lines[$i].Contains("ActiveCfg")) {
                $b = $lines[$i].Replace("ActiveCfg", "Build.0")
                if (-not ($lines -contains $b)) { [void]$lines.Insert($i + 1, $b); $n6++ }
              }
            }
            Set-Content -Path $s -Value $lines
            Write-Host ("6. game.sln : " + $n6 + " ligne(s) Build.0 ajoutee(s)")
          } else { Write-Host "6. ERREUR projet language introuvable"; $ok = $false }

          if (-not $ok) { exit 1 }

      - name: Convertir les projets au format actuel
        continue-on-error: true
        shell: cmd
        working-directory: src
        run: |
          "${{ steps.vs.outputs.devenv }}" game.sln /Upgrade

      - name: Compiler en Release
        continue-on-error: true
        shell: cmd
        working-directory: src
        run: msbuild game.sln /p:Configuration=Release /p:Platform=Win32 /m /v:normal > release.log 2>&1

      - name: Compiler en Debug
        continue-on-error: true
        shell: cmd
        working-directory: src
        run: msbuild game.sln /p:Configuration=Debug /p:Platform=Win32 /m /v:normal > debug.log 2>&1

      - name: Resume
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $out = $env:GITHUB_STEP_SUMMARY
          foreach ($f in @("src/release.log", "src/debug.log")) {
            Add-Content -Path $out -Value ("## " + $f)
            if (Test-Path $f) {
              $e = Select-String -Path $f -Pattern "error [A-Z]+[0-9]+" |
                   ForEach-Object { $_.Line.Trim() } | Select-Object -Unique -First 30
              if ($e) { foreach ($x in $e) { Add-Content -Path $out -Value ("    " + $x); Write-Host $x } }
              else { Add-Content -Path $out -Value "Aucune erreur." }
            } else { Add-Content -Path $out -Value "Journal absent." }
          }
          Add-Content -Path $out -Value "## Binaires produits"
          Get-ChildItem -Path . -Recurse -Include *.dll,*.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch "Includes" } |
            ForEach-Object { Add-Content -Path $out -Value ("    " + $_.FullName); Write-Host $_.FullName }

      - name: Recuperer les binaires
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binaires-mai2010
          path: |
            game/**/*.dll
            game/**/*.exe
            src/*.log
          if-no-files-found: warn
