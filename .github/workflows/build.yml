name: Compiler B.A.S.E.

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    env:
      LINK: /SAFESEH:NO

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Ajouter MSBuild au PATH
        uses: microsoft/setup-msbuild@v2

      - name: Localiser Visual Studio
        id: vs
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $path = & $vswhere -latest -property installationPath
          echo "devenv=$path\Common7\IDE\devenv.com" >> $env:GITHUB_OUTPUT

      - name: Convertir les projets au format actuel
        continue-on-error: true
        shell: cmd
        working-directory: src
        run: |
          "${{ steps.vs.outputs.devenv }}" game.sln /Upgrade

      - name: Compiler en Release
        continue-on-error: true
        shell: cmd
        working-directory: src
        run: msbuild game.sln /p:Configuration=Release /p:Platform=Win32 /m /v:normal

      - name: Compiler en Debug (secours)
        continue-on-error: true
        shell: cmd
        working-directory: src
        run: msbuild game.sln /p:Configuration=Debug /p:Platform=Win32 /m /v:normal

      # Inventaire complet, pour savoir exactement ou atterrissent les binaires.
      - name: Inventaire des binaires produits
        if: always()
        shell: pwsh
        run: |
          Write-Host "=== Tous les .dll et .exe du depot ==="
          Get-ChildItem -Path . -Recurse -Include *.dll,*.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch "Includes" } |
            ForEach-Object { "{0}  ({1} octets)" -f $_.FullName, $_.Length }

      - name: Recuperer les binaires
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binaires-BASE
          path: |
            **/*.dll
            **/*.exe
            !src/Includes/**
            !src/Libraries/**
          if-no-files-found: warn
