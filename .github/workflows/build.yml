name: Compiler B.A.S.E.

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Ajouter MSBuild au PATH
        uses: microsoft/setup-msbuild@v2

      - name: Localiser Visual Studio
        id: vs
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $path = & $vswhere -latest -property installationPath
          echo "devenv=$path\Common7\IDE\devenv.com" >> $env:GITHUB_OUTPUT

      - name: Convertir les projets au format actuel
        continue-on-error: true
        shell: cmd
        working-directory: src
        run: |
          "${{ steps.vs.outputs.devenv }}" game.sln /Upgrade

      - name: Compiler en Release
        continue-on-error: true
        shell: cmd
        working-directory: src
        run: msbuild game.sln /p:Configuration=Release /p:Platform=Win32 /m /v:normal > release.log 2>&1

      - name: Compiler en Debug
        continue-on-error: true
        shell: cmd
        working-directory: src
        run: msbuild game.sln /p:Configuration=Debug /p:Platform=Win32 /m /v:normal > debug.log 2>&1

      - name: Resume des erreurs
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $out = $env:GITHUB_STEP_SUMMARY
          foreach ($f in @("src/release.log", "src/debug.log")) {
            Add-Content -Path $out -Value ("## " + $f)
            Write-Host ("===== " + $f + " =====")
            if (Test-Path $f) {
              $e = Select-String -Path $f -Pattern "error [A-Z]+[0-9]+" |
                   ForEach-Object { $_.Line.Trim() } | Select-Object -Unique -First 40
              if ($e) {
                foreach ($ligne in $e) {
                  Add-Content -Path $out -Value ("    " + $ligne)
                  Write-Host $ligne
                }
              } else {
                Add-Content -Path $out -Value "Aucune erreur."
                Write-Host "Aucune erreur."
              }
            } else {
              Add-Content -Path $out -Value "Journal absent."
              Write-Host "Journal absent."
            }
          }
          Add-Content -Path $out -Value "## Binaires produits"
          Write-Host "===== binaires ====="
          Get-ChildItem -Path . -Recurse -Include *.dll,*.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch "Includes" } |
            ForEach-Object {
              Add-Content -Path $out -Value ("    " + $_.FullName)
              Write-Host $_.FullName
            }

      - name: Recuperer les binaires et les journaux
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binaires-BASE
          path: |
            game/**/*.dll
            game/**/*.exe
            src/*.log
          if-no-files-found: warn
